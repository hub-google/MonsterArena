name: Arena｜本次命名驗收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-names-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 確認40種名稱與既有造型
        run: node --test tests/mecha.test.mjs
      - name: 核對本次發布檔案
        env:
          VITE_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.ARENA_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$VITE_SUPABASE_URL" ]; then
            VITE_ARENA_V2=true npm run build
          else
            VITE_ARENA_V2=true VITE_ARENA_PREVIEW=true npm run build
          fi
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 10 "https://hub-google.github.io/monster-arena-web/?verify_names=$GITHUB_SHA" -o /tmp/arena-live.html && cmp -s dist/index.html /tmp/arena-live.html; then
              echo '公開站與本次建置一致'
              exit 0
            fi
            sleep 5
          done
          echo '公開站未更新到本次版本' >&2
          exit 1
      - run: npx playwright install chromium --only-shell
      - name: 公開站40種名稱與變形驗收
        env:
          PLAYWRIGHT_BASE_URL: https://hub-google.github.io/monster-arena-web/
          ARENA_TEST_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
        run: npx playwright test tests/smoke.spec.js tests/live-appearance.spec.js --project=chromium
      - name: 保存驗收截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-naming-review
          path: |
            test-results/ui-visual/
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
