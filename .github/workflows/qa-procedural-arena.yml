name: MA isolated published browser QA
on:
  push:
    branches: [qa/procedural-arena]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/procedural-arena.test.mjs
      - run: npm run test:e2e -- tests/procedural-arena-published.spec.js
        env:
          ARENA_TEST_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
          PLAYWRIGHT_BASE_URL: https://hub-google.github.io/MonsterArena/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ma-published-browser-screenshots
          path: test-results/
