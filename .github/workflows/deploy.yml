name: Arena 01｜測試與部署
run-name: Arena 01｜測試與部署｜#${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monster-arena-pages-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: arena_ci
          POSTGRES_DB: arena_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 取得 main 原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund
      - name: 靜態程式檢查
        run: npm run lint
      - name: 驗證遊戲介面契約
        run: npm run check:contract
      - name: 遊戲規則單元測試
        run: npm run test:unit
      - name: 驗證 SQL 組合
        run: npm run db:sql > /dev/null
      - name: 隔離 PostgreSQL 遊戲交易驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < supabase/schema/game_rules_v2.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < supabase/schema/functions/game_age_monsters.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < supabase/schema/functions/game_action.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/game-rules-v2.sql
      - name: 檢查 Supabase 驗證服務
        run: node scripts/check-supabase-game.mjs
      - name: 建置測試站
        run: npm run build
      - name: 安裝測試瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 測試建置後網頁
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/monster-arena-web/
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/monster-arena-vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/smoke.spec.js tests/authenticated-ui.spec.js --project=chromium
      - name: 發布 GitHub Pages 測試站
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false

      - name: 產生執行摘要
        if: always()
        run: |
          echo "## Arena 測試與部署報告" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 執行結果：${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 登入後瀏覽器測試使用模擬 API；不代表真實多帳號資料庫驗收" >> "$GITHUB_STEP_SUMMARY"
