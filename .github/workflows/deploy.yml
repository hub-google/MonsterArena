name: Arena 01｜網站部署
run-name: Arena 01｜網站部署｜#${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monster-arena-pages-main
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    name: 建置網站
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main 原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund
      - name: 建置發布版本
        env:
          VITE_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.ARENA_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$VITE_SUPABASE_URL" ] || [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
            case "$VITE_SUPABASE_URL" in *fanffwnhkxpfhttylntw*|*unapiwajmgqqtdkixaab*) echo '禁止共用資料庫作為新版測試站' >&2; exit 1;; esac
            VITE_ARENA_V2=true npm run build
          else
            VITE_ARENA_V2=true VITE_ARENA_PREVIEW=true npm run build
          fi
      - name: 上傳 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publish-pages:
    name: 發布 GitHub Pages
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 設定 Pages 發布來源
        uses: actions/configure-pages@v5
      - name: 部署 Artifact
        id: deployment
        uses: actions/deploy-pages@v4

  acceptance-once:
    if: contains(github.event.head_commit.message, '[arena-acceptance-once]')
    name: 一次性功能驗收（不部署正式站）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝依賴及瀏覽器
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 單元與合約測試
        run: |
          npm run lint
          npm run check:contract
          npm run test:unit
      - name: 建立隔離 PostgreSQL
        run: |
          docker run -d --name arena-acceptance -e POSTGRES_PASSWORD=arena_test -e POSTGRES_DB=arena_test postgres:16
          for i in $(seq 1 60); do docker exec arena-acceptance pg_isready -U postgres && break; sleep 1; done
          docker exec -i arena-acceptance psql -X -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/fixture.sql
          node scripts/build-game-sql.mjs --preview-bootstrap | docker exec -i arena-acceptance psql -X -U postgres -d arena_test -v ON_ERROR_STOP=1
      - name: SQL 功能及交易併發
        run: |
          set -euo pipefail
          for f in game-rules-v2 trained-balance long-term-economy; do node scripts/build-game-sql.mjs --preview-test "tests/sql/$f.sql" | docker exec -i arena-acceptance psql -X -U postgres -d arena_test -v ON_ERROR_STOP=1; done
          docker exec -i arena-acceptance psql -X -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/preview-isolation.sql
          PG_CONTAINER=arena-acceptance node scripts/test-concurrent-transactions.mjs
      - name: V2 瀏覽器與實際 SQL 功能驗收
        run: |
          VITE_ARENA_PREVIEW=true VITE_ARENA_V2=true VITE_SUPABASE_URL=https://arena-v2-ci.supabase.co VITE_SUPABASE_ANON_KEY=sb_publishable_test npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/arena-v2.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/MonsterArena/ >/dev/null && break; sleep 1; done
          PG_CONTAINER=arena-acceptance PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173/MonsterArena/ npm run test:e2e -- v2-ui.spec.js
      - name: 圖鑑與 360 度 WebGL 瀏覽器驗收
        if: always()
        env:
          ARENA_TEST_SUPABASE_URL: https://fanffwnhkxpfhttylntw.supabase.co
        run: |
          VITE_ARENA_PREVIEW=true VITE_ARENA_V2=true npm run dev -- --host 127.0.0.1 --port 4174 --strictPort >/tmp/arena-appearance.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/MonsterArena/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4174/MonsterArena/ npm run test:e2e -- smoke.spec.js live-appearance.spec.js mecha3d-ui.spec.js
      - name: 保留驗收截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-acceptance-screenshots
          path: test-results/
          retention-days: 7
