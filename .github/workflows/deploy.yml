name: Arena 01｜網站部署
run-name: Arena 01｜網站部署｜#${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monster-arena-pages-main
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    name: 建置網站
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main 原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund
      - name: 建置發布版本
        env:
          VITE_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.ARENA_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$VITE_SUPABASE_URL" ] || [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
            case "$VITE_SUPABASE_URL" in *fanffwnhkxpfhttylntw*|*unapiwajmgqqtdkixaab*) echo '禁止共用資料庫作為新版測試站' >&2; exit 1;; esac
            VITE_ARENA_V2=true npm run build
          else
            VITE_ARENA_V2=true VITE_ARENA_PREVIEW=true npm run build
          fi
      - name: 上傳 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publish-pages:
    name: 發布 GitHub Pages
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 設定 Pages 發布來源
        uses: actions/configure-pages@v5
      - name: 部署 Artifact
        id: deployment
        uses: actions/deploy-pages@v4

  auth-recovery-once:
    if: contains(github.event.head_commit.message, '[auth-e2e]')
    name: 一次性密碼重設驗收（隔離 Auth）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npx playwright install --with-deps chromium
      - name: 實際寄信與瀏覽器重設（本機隔離資料）
        run: bash scripts/test-password-recovery.sh
