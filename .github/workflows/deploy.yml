name: Build, check and deploy GitHub Pages test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monster-arena-pages-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run lint
      - name: Verify authoritative game contract
        run: npm run check:contract
      - name: Verify original Supabase Authentication
        run: node scripts/check-supabase-game.mjs
      - name: Build test site
        run: npm run build
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test against build
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/monster-arena-web/
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/monster-arena-vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/smoke.spec.js --project=chromium
      - name: Publish test to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
