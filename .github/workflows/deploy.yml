name: Arena 01｜測試與部署
run-name: Arena 01｜測試與部署｜#${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monster-arena-pages-main
  cancel-in-progress: true

jobs:
  cleanup-branches:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[arena-cleanup-branches-20261124]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: 確認 main 並清理六個舊分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$GITHUB_REF_NAME" = main
          test "$(gh api "repos/$repo" --jq .default_branch)" = main
          # Attempt the supported Pages source migration before removing its old branch.
          if [ "$(gh api "repos/$repo/pages" --jq .build_type)" != workflow ]; then
            if gh api --method PUT "repos/$repo/pages" -f build_type=workflow; then
              echo 'Pages 已改用 Actions Artifact' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Pages 設定需由管理員切換至 GitHub Actions；仍依指示清理舊分支。' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          for branch in master release gh-pages gh-pages-preview legacy-main-20261116 supabase-stable-fixes; do
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
              echo "已刪除 $branch" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          remaining=$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          printf '%s\n' "$remaining"
          test "$remaining" = main
          echo '驗證完成：只剩 main' >> "$GITHUB_STEP_SUMMARY"
  build-deploy:
    runs-on: ubuntu-latest
    outputs:
      index_sha: ${{ steps.build.outputs.index_sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: arena_ci
          POSTGRES_DB: arena_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 取得 main 原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund
      - name: 靜態程式檢查
        run: npm run lint
      - name: 驗證遊戲介面契約
        run: npm run check:contract
      - name: 遊戲規則單元測試
        run: npm run test:unit
      - name: 驗證 SQL 組合
        run: npm run db:sql > /dev/null
      - name: 隔離 PostgreSQL 遊戲交易驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/fixture.sql
          npm run --silent db:sql > /tmp/arena-current.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-current.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/game-rules-v2.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/combat-balance.sql
      - name: 檢查 Supabase 驗證服務
        run: node scripts/check-supabase-game.mjs
      - name: 建置舊版相容測試站
        run: npm run build
      - name: 安裝測試瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 測試建置後網頁
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/monster-arena-web/
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/monster-arena-vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/smoke.spec.js tests/authenticated-ui.spec.js --project=chromium
      - name: 新版瀏覽器與真實隔離 SQL 交易整合驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          VITE_ARENA_V2: 'true'
          VITE_SUPABASE_URL: https://arena-v2-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_arena_ci_only
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174/monster-arena-web/
        run: |
          npm run build -- --outDir dist-v2
          npm run preview -- --outDir dist-v2 --port 4174 --host 127.0.0.1 > /tmp/arena-v2-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/v2-ui.spec.js --project=chromium
      - name: 準備實際發布版本
        id: build
        env:
          VITE_SUPABASE_URL: ${{ vars.ARENA_TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.ARENA_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$VITE_SUPABASE_URL" ] || [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
            case "$VITE_SUPABASE_URL" in *fanffwnhkxpfhttylntw*|*unapiwajmgqqtdkixaab*) echo '禁止共用資料庫作為新版測試站' >&2; exit 1;; esac
            VITE_ARENA_V2=true npm run build
            echo '已配置獨立新版測試後端' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '未配置獨立測試後端；公開站仍使用既有後端' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "index_sha=$(sha256sum dist/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: 保存實際瀏覽器 UI 截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-ui-visual-review
          path: test-results/ui-visual/
          if-no-files-found: warn
          retention-days: 7
      - name: 上傳 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 產生執行摘要
        if: always()
        run: |
          echo "## Arena 測試與部署報告" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 執行結果：${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 舊版登入後測試使用模擬 API；新版瀏覽器交易使用隔離 PostgreSQL 真實 RPC，登入傳輸仍為測試身分" >> "$GITHUB_STEP_SUMMARY"

  publish-pages:
    name: 發布 GitHub Pages 測試站
    needs: [build-deploy, cleanup-branches]
    if: always() && needs.build-deploy.result == 'success' && (needs.cleanup-branches.result == 'success' || needs.cleanup-branches.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 檢查 Pages 發布來源
        uses: actions/configure-pages@v5
      - name: 部署 Artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 驗證公開網頁為本次建置版本
        env:
          EXPECTED_SHA: ${{ needs.build-deploy.outputs.index_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test -n "$PAGE_URL"
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 10 "${PAGE_URL%/}/?arena_build=${GITHUB_SHA}" -o /tmp/arena-live.html && [ "$(sha256sum /tmp/arena-live.html | cut -d ' ' -f 1)" = "$EXPECTED_SHA" ]; then
              echo "公開網頁版本確認成功：$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "公開網頁尚未回傳本次建置版本" >&2
          exit 1
