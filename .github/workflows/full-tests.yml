name: Arena 02｜完整功能測試
run-name: Arena 02｜完整功能測試｜#${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-arena-manual-tests
  cancel-in-progress: true

jobs:
  full-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: arena_ci
          POSTGRES_DB: arena_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 取得 main 原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund
      - name: 靜態程式檢查
        run: npm run lint
      - name: 驗證遊戲介面契約
        run: npm run check:contract
      - name: 遊戲規則單元測試
        run: npm run test:unit
      - name: 驗證 SQL 組合
        run: npm run db:sql > /dev/null
      - name: 隔離 PostgreSQL 遊戲交易驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/fixture.sql
          npm run --silent db:sql > /tmp/arena-current.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-current.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/game-rules-v2.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/combat-balance.sql
          npm run --silent db:sql -- --preview-bootstrap > /tmp/arena-preview.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-preview.sql
          npm run --silent db:sql -- --preview-test tests/sql/game-rules-v2.sql > /tmp/arena-preview-test.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-preview-test.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < tests/sql/preview-isolation.sql
      - name: 多人同時交易及公會鎖定驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-concurrent-transactions.mjs
      - name: 30與90日養成及金幣收支模擬
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          npm run --silent db:sql -- --preview-test tests/sql/long-term-economy.sql > /tmp/arena-long-term.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-long-term.sql
          npm run --silent db:sql -- --preview-test tests/sql/trained-balance.sql > /tmp/arena-trained-balance.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d arena_test -v ON_ERROR_STOP=1 < /tmp/arena-trained-balance.sql
      - name: 檢查 Supabase 驗證服務
        run: node scripts/check-supabase-game.mjs
      - name: 建置舊版相容測試站
        run: npm run build
      - name: 安裝測試瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 測試建置後網頁
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/monster-arena-web/
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/monster-arena-vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/smoke.spec.js tests/authenticated-ui.spec.js --project=chromium --output=test-results/legacy-browser
      - name: 新版瀏覽器與真實隔離 SQL 交易整合驗收
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          VITE_ARENA_V2: 'true'
          VITE_ARENA_PREVIEW: 'true'
          VITE_SUPABASE_URL: https://arena-v2-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_arena_ci_only
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174/monster-arena-web/
        run: |
          npm run build -- --outDir dist-v2
          npm run preview -- --outDir dist-v2 --port 4174 --host 127.0.0.1 > /tmp/arena-v2-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/v2-ui.spec.js --project=chromium --output=test-results/v2-browser
      - name: 保存實際瀏覽器 UI 截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-ui-visual-review
          path: test-results/ui-visual/
          if-no-files-found: warn
          retention-days: 7
